worker_processes auto;
events { worker_connections 1024; }

http {
    # Upstream API pool. Add more `server api:8000` lines (or `docker compose up
    # --scale api=N` with the host port removed) to load-balance across replicas.
    upstream shortener_api {
        server api:8000;
        keepalive 32;
    }

    # Edge rate limiting — defense in depth *in front of* the app's per-IP limiter
    # (ADR-005). Absorbs volumetric floods before they reach FastAPI.
    limit_req_zone $binary_remote_addr zone=edge:10m rate=50r/s;

    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","request_time":$request_time}';
    access_log /var/log/nginx/access.log json;

    server {
        listen 80;
        server_name _;

        # Give the app the real client so its IP-keyed rate limiter is correct.
        # The app only trusts these when TRUST_PROXY=true (i.e. behind this proxy).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Liveness probe: cheap, unthrottled, no access log noise.
        location = /livez {
            proxy_pass http://shortener_api;
            access_log off;
        }

        location / {
            limit_req zone=edge burst=100 nodelay;
            proxy_pass http://shortener_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
